name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Lấy mã nguồn từ kho lưu trữ GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Bước 2: Thiết lập môi trường Java JDK 17 (Phù hợp với các phiên bản Gradle mới)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Bước 3: Cấp quyền thực thi cho file chạy Gradle (gradlew)
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Bước 4: Chạy lệnh xây dựng ứng dụng (Build sinh ra file APK Debug)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Bước 5: Lưu trữ và tải file APK lên GitHub Artifacts để bạn có thể tải về máy
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
